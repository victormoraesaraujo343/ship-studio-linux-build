# Linux release — builds the AppImage and attaches it to the tagged release.
#
# Separate from release.yml on purpose. That workflow is the upstream macOS
# pipeline: it signs with an Apple certificate, produces updater artifacts, and
# writes the auto-update manifest into a *different* repo (ship-studio/releases)
# with a PAT. None of that infrastructure belongs to this fork, and none of its
# secrets exist here. Bolting Linux onto that matrix would make every Linux
# build depend on credentials it can't have.
#
# So this workflow deliberately does less: compile, bundle, attach. No signing,
# no updater manifest — see "Auto-update" below.
name: Release (Linux)

on:
  push:
    tags:
      - 'v*-linux'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the AppImage to'
        required: true

jobs:
  build:
    name: AppImage (x86_64)
    # Pinned to the oldest supported runner on purpose: an AppImage links
    # against the glibc it was built with, so building on a newer image raises
    # the minimum glibc for everyone downloading it. Older runner = runs on more
    # distros. This is the one place where "latest" is the wrong default.
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Tauri's Linux backend is WebKitGTK; these are its build-time deps.
      # libayatana-appindicator is what the tray icon binds against.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Install frontend dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test:run

      - name: Build AppImage
        env:
          # linuxdeploy ships its own `strip`, built in 2024. Any library
          # carrying a `.relr.dyn` section (RELR relocations — standard on
          # current rolling distros) makes it fail with "unknown type [0x13]",
          # and one failed strip aborts the whole bundle. Stripping only makes
          # the file smaller, so skipping it costs nothing.
          #
          # ubuntu-22.04 is old enough that this probably won't trigger here.
          # It stays because the same command has to work when someone builds
          # locally on Arch/Fedora, where it does trigger — and a CI recipe that
          # only works in CI is how local builds quietly rot.
          NO_STRIP: '1'
        run: |
          pnpm tauri build --bundles appimage \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # The AppImage built here opened as a white window on an Arch-based
      # machine, logging
      #
      #   Could not create default EGL display: EGL_BAD_PARAMETER. Aborting...
      #
      # WebKit aborts its renderer there and paints nothing while the process
      # stays up. What is established:
      #
      #   built here (ubuntu-22.04 libraries)  -> fails on that machine
      #   built on that machine (its own libs) -> works
      #   the binary run unbundled             -> works
      #
      # So it is the bundled dependency closure, not the app and not the
      # driver. linuxdeploy copies ~150 system libraries into the AppDir and
      # an AppImage puts its own lib directory ahead of the host's, so on a
      # distro whose graphics stack has moved on, Ubuntu 22.04's copies shadow
      # libraries that have to match the running driver. (Independent evidence
      # of how far apart the two are: this AppDir cannot even be repackaged on
      # Arch — it references libtiff.so.5, which no longer exists there.)
      #
      # Removing the graphics libraries so they resolve from the host is the
      # standard remedy and the only lever available, since Tauri exposes no
      # exclude list for its AppImage bundler. Note it is NOT yet confirmed to
      # fix the reported machine: deleting libwayland-egl locally appeared to
      # fix it, but a pristine local build containing that same library works
      # fine, so that result was the build host changing, not the deletion.
      # The check that will actually settle it is running this workflow's
      # artifact on the machine that failed.
      - name: Unbundle host graphics libraries and repackage
        env:
          NO_STRIP: '1'
          ARCH: x86_64
          # The runner has no FUSE, so an AppImage cannot mount itself to run.
          # Tauri handles this internally when it drives linuxdeploy; invoking
          # linuxdeploy directly does not, and fails with
          #   dlopen(): error loading libfuse.so.2
          # This makes it unpack to a temp dir and exec from there instead. It
          # is inherited by the appimage plugin linuxdeploy runs in turn, which
          # needs it for the same reason.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          BUNDLE_DIR=src-tauri/target/release/bundle/appimage
          APPDIR=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.AppDir' -type d | head -1)
          if [ -z "$APPDIR" ]; then
            echo "No AppDir found — the bundle step did not produce one."
            exit 1
          fi

          # The AppDir is named after productName, which contains a space
          # ("Ship Studio.AppDir"), so every path here has to survive it —
          # -print0 with a null-delimited read rather than word splitting.
          REMOVED=0
          for pattern in 'libwayland-egl.so*' 'libEGL.so*' 'libGL.so*' 'libGLX.so*' \
                         'libgbm.so*' 'libdrm.so*' 'libGLdispatch.so*'; do
            while IFS= read -r -d '' f; do
              echo "Removing bundled $(basename "$f") — must come from the host"
              rm -f "$f"
              REMOVED=$((REMOVED + 1))
            done < <(find "$APPDIR/usr/lib" -maxdepth 1 -name "$pattern" -print0 2>/dev/null)
          done

          echo "Removed $REMOVED bundled graphics librar(y|ies)."
          if [ "$REMOVED" -eq 0 ]; then
            echo "Nothing to remove. Either linuxdeploy's behaviour changed or a"
            echo "newer runner no longer pulls these in. Not an error, but the"
            echo "smoke test below is now the only thing standing between a"
            echo "blank window and a published release."
            exit 0
          fi

          rm -f "$BUNDLE_DIR"/*.AppImage
          LD=$(find "$HOME/.cache/tauri" -name 'linuxdeploy-*.AppImage' -type f | head -1)
          if [ -z "$LD" ]; then
            echo "linuxdeploy is not in Tauri's cache — cannot repackage."
            exit 1
          fi
          chmod +x "$LD"
          "$LD" --appdir "$APPDIR" --output appimage

          # linuxdeploy writes the AppImage into the working directory, not
          # beside the AppDir, so move it back where the next step looks.
          NEW=$(find . -maxdepth 1 -name '*.AppImage' -type f | head -1)
          if [ -z "$NEW" ]; then
            echo "Repackaging produced no AppImage."
            exit 1
          fi
          mv "$NEW" "$BUNDLE_DIR"/
          ls -la "$BUNDLE_DIR"

      # createUpdaterArtifacts is true in tauri.conf.json, which makes the build
      # demand TAURI_SIGNING_PRIVATE_KEY — a secret this fork does not have (the
      # keypair belongs to upstream). Overriding it per-invocation above keeps
      # tauri.conf.json untouched, so the macOS/Windows pipelines still see the
      # config they expect.

      - name: Locate the AppImage
        id: appimage
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage produced — the bundle step failed silently."
            find src-tauri/target/release/bundle -type f | head -50
            exit 1
          fi
          # Tauri names it "Ship Studio_0.18.6_amd64.AppImage". The space is
          # fine on disk but makes an awkward download URL, so republish under a
          # stable, space-free name.
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%-linux}"
          DEST="ShipStudio_${VERSION}_amd64.AppImage"
          cp "$APPIMAGE" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"

      # A binary that cannot start is worth catching here rather than in a bug
      # report. xvfb gives it a display; the app is killed after it proves it
      # came up, since there is nothing to interact with headlessly.
      # An earlier version of this step only checked that the process was still
      # alive after a timeout, and it passed a build that opened as a white
      # window: WebKit aborted its renderer while the process stayed up. Staying
      # up is necessary and nowhere near sufficient, so this checks three things
      # — it survives, it says nothing fatal, and something was actually painted.
      - name: Smoke test — the AppImage starts and renders
        run: |
          sudo apt-get install -y xvfb imagemagick
          chmod +x "${{ steps.appimage.outputs.path }}"

          Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 3

          "./${{ steps.appimage.outputs.path }}" > smoke.log 2>&1 &
          APP_PID=$!
          sleep 25

          echo "----- app output -----"
          cat smoke.log || true
          echo "----------------------"

          FAILED=0

          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "FAIL: the app exited on its own."
            FAILED=1
          fi

          # The renderer announces its own death before the process notices.
          # These are the lines that preceded a white window in practice.
          if grep -qE 'EGL_BAD|Could not create default EGL|Aborting\.\.\.|Failed to create GBM|cannot open shared object' smoke.log; then
            echo "FAIL: a fatal graphics/runtime error was logged."
            FAILED=1
          fi

          # A window that painted has many distinct colours; a blank one has
          # essentially a single flat fill. This is the check that would have
          # caught the white screen.
          import -window root screenshot.png 2>/dev/null || true
          if [ -f screenshot.png ]; then
            COLORS=$(identify -format %k screenshot.png 2>/dev/null || echo 0)
            echo "Distinct colours on screen: $COLORS"
            if [ "$COLORS" -lt 5 ]; then
              echo "FAIL: the screen is effectively blank — the window never painted."
              FAILED=1
            fi
          else
            echo "WARN: could not capture a screenshot; render was not verified."
          fi

          kill "$APP_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "AppImage started and painted a real window."

      - name: Upload the smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshot
          path: screenshot.png
          if-no-files-found: warn

      - name: Attach the AppImage to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ steps.appimage.outputs.path }}
          # Published, not draft. A draft release is invisible to anonymous
          # callers of the releases API, which is exactly how AppImage update
          # managers (Gear Lever and friends) look for a new version — a draft
          # would build the artifact and then hide it from the thing meant to
          # fetch it.
          draft: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as a workflow artifact too
        uses: actions/upload-artifact@v6
        with:
          name: ShipStudio-linux-x86_64
          path: ${{ steps.appimage.outputs.path }}
          if-no-files-found: error

# Auto-update on Linux is deliberately not wired up.
#
# The updater endpoints in tauri.conf.json point at
# github.com/ship-studio/releases — upstream's public releases repo, which this
# fork cannot write to (release.yml pushes there with a RELEASES_PAT secret that
# does not exist here). Signing the bundle would still leave nowhere to publish
# the manifest, so the signature would be decoration.
#
# To enable it later: generate a keypair (`pnpm tauri signer generate`), put the
# public half in tauri.conf.json, store the private half plus its password as
# repo secrets, point the updater endpoints at this repo's releases, and add a
# linux-x86_64 entry to the manifest. That also decouples the fork's update
# channel from upstream's, which is a prerequisite regardless of platform.
